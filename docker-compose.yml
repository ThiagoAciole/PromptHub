services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-prompthub}
      POSTGRES_USER: ${POSTGRES_USER:-prompthub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-prompthub}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3333
      DATABASE_URL: postgres://${POSTGRES_USER:-prompthub}:${POSTGRES_PASSWORD:-prompthub}@postgres:5432/${POSTGRES_DB:-prompthub}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-10}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "${API_PORT:-3333}:3333"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3333/health"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
