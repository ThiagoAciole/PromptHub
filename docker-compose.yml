services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: prompthub
      POSTGRES_USER: prompthub
      POSTGRES_PASSWORD: prompthub
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prompthub -d prompthub"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - prompt-hub-postgres-data:/var/lib/postgresql/data

  postgres-test:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: prompthub_test
      POSTGRES_USER: prompthub
      POSTGRES_PASSWORD: prompthub
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prompthub -d prompthub_test"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - prompt-hub-postgres-test-data:/var/lib/postgresql/data

volumes:
  prompt-hub-postgres-data:
  prompt-hub-postgres-test-data:
