frontend em uma única imagem e porta 3333. Faça revisão de conflitos entre as
outras tarefas, execute install frozen, typecheck, lint, testes, build e
git diff --check.

Não faça refatorações fora do escopo. Se encontrar falha, corrija a causa,
valide novamente e relate limitações de Docker/PostgreSQL quando aplicável.
"""
